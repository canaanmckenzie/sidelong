<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo</title>
<!-- The README screenshots render from this page:
  npm run dev, then screenshot http://localhost:5173/docs/demo.html
  (append ?theme=dark for the slate variant) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="meta"><span class="hint"><kbd>←</kbd> <kbd>→</kbd> to move</span></div>
    <button id="theme" type="button"><span class="swatch"></span><span id="themeLabel">b/w</span></button>
  </header>
  <main class="deck" id="deck"></main>
  <form class="composer" id="composer">
    <textarea id="q" rows="1" placeholder="Ask a follow-up, or something new"></textarea>
    <button id="ask" type="submit">Ask</button>
    <button id="limits" type="button">%</button>
  </form>
</div>
<script type="module">
if (new URLSearchParams(location.search).get("theme") === "dark") {
  document.documentElement.dataset.theme = "dark";
  document.getElementById("themeLabel").textContent = "slate";
}
import { initDeck } from "../src/deck.js";
import { state, addPage } from "../src/store.js";
import { SEED } from "../src/fixtures.js";
for (const p of SEED) addPage({ ...p });
addPage({
  q: "how do Smart Queues actually get applied on a UniFi gateway?",
  a: [
    "Under the hood it's plain Linux traffic control. When you set the up and down rates, the gateway writes a `tc` hierarchy — egress is the easy half, and ingress gets redirected through an `ifb` device so it can be shaped at all:",
    [
      "```bash",
      "WAN=eth8  UP=450mbit  DOWN=450mbit",
      "",
      "# egress: fq_codel under a rate ceiling",
      "tc qdisc replace dev $WAN root handle 1: tbf \\",
      "   rate $UP burst 128k latency 50ms",
      "tc qdisc add dev $WAN parent 1:1 \\",
      "   fq_codel target 5ms interval 100ms",
      "",
      "# ingress: mirror the WAN into ifb0, shape it there",
      "ip link add ifb0 type ifb && ip link set ifb0 up",
      "tc qdisc add dev $WAN handle ffff: ingress",
      "tc filter add dev $WAN parent ffff: matchall \\",
      "   action mirred egress redirect dev ifb0",
      "```",
    ].join("\n"),
    "That redirect is the whole secret: Linux can only queue packets it is about to *send*, so downloads are shaped by pretending to retransmit them through a virtual interface. It is also why Smart Queues costs CPU — every packet crosses the stack twice, and hardware offload has to be switched off.",
  ].join("\n\n"),
  ang: 222, r: 0.91, near: 0, sim: 0.61, novel: false,
}, true);
state.active = state.pages.length - 1;
initDeck({
  deck: document.getElementById("deck"),
  form: document.getElementById("composer"),
  input: document.getElementById("q"),
});
</script>
</body>
</html>
