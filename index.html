<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidelong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Sidelong</div>
    <div class="meta"><span id="count"></span><span class="hint"> · <kbd>←</kbd> <kbd>→</kbd> to move</span></div>
    <button id="theme" type="button" aria-label="Switch between black-on-white and slate-with-cream"><span class="swatch"></span><span id="themeLabel">b/w</span></button>
  </header>
  <main class="deck" id="deck"></main>
  <form class="composer" id="composer">
    <textarea id="q" rows="1" placeholder="Ask a follow-up, or something new" aria-label="Your question"></textarea>
    <button id="ask" type="submit">Ask</button>
  </form>
</div>
</body>
</html>
